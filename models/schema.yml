version: 2

models:
  - name: stg_customers
    description: "Cleaned customers from raw.customers"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null

  - name: stg_orders
    description: "Cleaned orders from raw.orders"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null

  - name: stg_payments
    description: "Cleaned payments from raw.payments"
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null

  - name: int_order_payments
    description: "Aggregated payments per order"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: dim_customers
    description: "Customer dimension"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Order fact table with payments info"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
